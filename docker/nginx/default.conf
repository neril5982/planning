server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # PHP API — ALL /api/* requests are routed through the central router
    location ~ ^/api {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME  /var/www/html/api/router.php;
        fastcgi_param REQUEST_URI      $request_uri;
        fastcgi_param QUERY_STRING     $query_string;
        fastcgi_param REQUEST_METHOD   $request_method;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 120;
    }

    # PHP pages — direct file access
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 120;
    }

    # Static files
    location / {
        try_files $uri /login.php;
    }

    # Prevent indexing by search engines and AI crawlers
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # Block direct access to backend directories
    location ~ ^/(sql|tools|docker)/ {
        deny all;
    }
    location = /config.php {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
